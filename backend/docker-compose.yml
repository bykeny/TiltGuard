services:
  tiltguard-db:
    image: postgres:16
    container_name: tiltguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tiltguard_dev
    ports:
      - "5432:5432"
    volumes:
      - tiltguard-db-data:/var/lib/postgresql/data

volumes:
  tiltguard-db-data:
